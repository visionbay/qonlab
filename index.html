<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로또 번호 추첨기</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="topbar">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="다크 모드로 전환" aria-pressed="false">
          <span class="theme-toggle__icon" aria-hidden="true">☀</span>
          <span class="theme-toggle__text">화이트</span>
        </button>
      </div>

      <div class="header">
        <h1>로또 번호 추첨기</h1>
        <p>6개 번호와 보너스 번호를 무작위로 생성해 드립니다.</p>
      </div>

      <div class="numbers" id="numbers" aria-label="추첨 번호"></div>
      <div class="bonus" id="bonus" aria-label="보너스 번호"></div>

      <button class="action-button" id="actionButton" type="button">번호 생성하기</button>
      <p class="info">버튼을 누르면 새로운 로또 번호를 확인할 수 있습니다.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
