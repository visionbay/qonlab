<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google-adsense-account" content="ca-pub-3906729189766983" />
  <title>로또 번호 추첨기</title>
  <link rel="stylesheet" href="styles.css" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3906729189766983" crossorigin="anonymous"></script>
</head>
<body>
  <main class="container">
    <section class="card lotto-card">
      <div class="topbar">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="다크 모드로 전환" aria-pressed="false">
          <span class="theme-toggle__icon" aria-hidden="true">☀</span>
          <span class="theme-toggle__text">화이트</span>
        </button>
      </div>

      <div class="header">
        <h1>로또 번호 추첨기</h1>
        <p>6개 번호와 보너스 번호를 무작위로 생성해 드립니다.</p>
      </div>

      <div class="numbers" id="numbers" aria-label="추첨 번호"></div>
      <div class="bonus" id="bonus" aria-label="보너스 번호"></div>

      <button class="action-button" id="actionButton" type="button">번호 생성하기</button>
      <p class="info">버튼을 누르면 새로운 로또 번호를 확인할 수 있습니다.</p>
    </section>

    <section class="card contact-card" aria-labelledby="partnerTitle">
      <div class="header">
        <h2 id="partnerTitle">제휴 문의</h2>
        <p>함께 진행하고 싶은 제휴 내용을 남겨주시면 확인 후 연락드리겠습니다.</p>
      </div>

      <form class="partner-form" id="partnerForm" action="https://formspree.io/f/xqejjqar" method="POST">
        <input class="honeypot" type="text" name="_gotcha" tabindex="-1" autocomplete="off" />
        <input type="hidden" name="_subject" value="새 제휴 문의가 도착했습니다" />

        <label>
          이름
          <input type="text" name="name" autocomplete="name" required />
        </label>

        <label>
          회사/브랜드
          <input type="text" name="company" autocomplete="organization" />
        </label>

        <label>
          이메일
          <input type="email" name="email" autocomplete="email" required />
        </label>

        <label>
          문의 내용
          <textarea name="message" rows="5" required placeholder="제휴 목적, 제안 내용, 연락 가능한 시간 등을 적어주세요."></textarea>
        </label>

        <button class="action-button form-submit" type="submit">문의 보내기</button>
        <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="card comments-card" aria-labelledby="commentsTitle">
      <div class="header">
        <h2 id="commentsTitle">댓글</h2>
        <p>의견이나 질문을 자유롭게 남겨주세요.</p>
      </div>

      <div id="disqus_thread"></div>
      <script>
        var disqus_config = function () {
          this.page.url = window.location.origin + window.location.pathname;
          this.page.identifier = "qonlab-home";
        };

        (function () {
          var d = document;
          var s = d.createElement("script");
          s.src = "https://sang-kr.disqus.com/embed.js";
          s.setAttribute("data-timestamp", +new Date());
          (d.head || d.body).appendChild(s);
        })();
      </script>
      <noscript>
        댓글을 보려면 JavaScript를 활성화해 주세요.
        <a href="https://disqus.com/?ref_noscript">Disqus 댓글 보기</a>
      </noscript>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
