<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로또 번호 추첨기</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="header">
        <h1>로또 번호 추첨기</h1>
        <p>6개 번호와 보너스 번호를 무작위로 생성해 드립니다.</p>
      </div>
      <div class="numbers" id="numbers"></div>
      <div class="bonus" id="bonus"></div>
      <button id="actionButton">번호 생성하기</button>
      <p class="info">매번 새로고침 없이 버튼을 눌러 로또 번호를 확인하세요.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
